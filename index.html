<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Freelance</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== Bingkai aplikasi (ditengahkan di layar) ===== -->
    <div class="app">
        <!-- Navbar atas -->
        <header class="navbar">
            <div class="brand">
                <span class="brand-logo">K</span>
                <div>
                    <strong>Kas Freelance</strong>
                    <small>Money management</small>
                </div>
            </div>

            <nav>
                <button class="nav-item aktif" data-halaman="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                    <span>Dashboard</span>
                </button>
                <button class="nav-item" data-halaman="transaksi">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4"/></svg>
                    <span>Transaksi</span>
                </button>
            </nav>

            <!-- Tombol aksi utama di kanan navbar -->
            <div class="navbar-aksi">
                <button class="btn btn-utama" id="btn-tambah-transaksi">+ Transaksi</button>
            </div>
        </header>

        <main>
            <header class="topbar">
                <p class="topbar-tanggal" id="tanggal-hari-ini"></p>
                <h1 id="judul-halaman">Dashboard</h1>
            </header>

            <!-- ===== Halaman: Dashboard ===== -->
            <section class="halaman aktif" id="halaman-dashboard">
                <!-- W5: Ringkasan -->
                <div class="ringkasan">
                    <article class="kartu kartu-saldo">
                        <p class="kartu-label">Saldo</p>
                        <p class="kartu-angka" id="saldo">Rp 0</p>
                        <p class="kartu-sub">Pemasukan − pengeluaran</p>
                    </article>
                    <article class="kartu kartu-pemasukan">
                        <p class="kartu-label">Total Pemasukan</p>
                        <p class="kartu-angka" id="total-pemasukan">Rp 0</p>
                        <p class="kartu-sub" id="info-pemasukan">0 transaksi</p>
                    </article>
                    <article class="kartu kartu-pengeluaran">
                        <p class="kartu-label">Total Pengeluaran</p>
                        <p class="kartu-angka" id="total-pengeluaran">Rp 0</p>
                        <p class="kartu-sub" id="info-pengeluaran">0 transaksi</p>
                    </article>
                </div>

                <div class="panel">
                    <div class="panel-kepala">
                        <h2>Transaksi terbaru</h2>
                        <button class="link" data-ke="transaksi">Lihat semua</button>
                    </div>
                    <ul class="daftar" id="dashboard-transaksi"></ul>
                </div>

            </section>

            <!-- ===== Halaman: Transaksi (W2, W3) ===== -->
            <section class="halaman" id="halaman-transaksi">
                <div class="panel">
                    <!-- Diisi oleh JavaScript, terbaru di atas -->
                    <ul class="daftar" id="daftar-transaksi"></ul>
                </div>
            </section>

        </main>

        <footer class="footer">Hilmi Taqiyuddin Haq &middot; 5053251012</footer>
    </div>

    <!-- ===== Dialog: tambah transaksi (W1, W6) ===== -->
    <dialog id="dialog-transaksi">
        <form id="form-transaksi" novalidate>
            <div class="dialog-kepala">
                <h2 id="judul-dialog-transaksi">Tambah Transaksi</h2>
                <button type="button" class="btn-tutup" data-tutup aria-label="Tutup">&times;</button>
            </div>

            <div class="pilih-jenis">
                <input type="radio" name="jenis" id="jenis-pemasukan" value="pemasukan">
                <label for="jenis-pemasukan">Pemasukan</label>
                <input type="radio" name="jenis" id="jenis-pengeluaran" value="pengeluaran" checked>
                <label for="jenis-pengeluaran">Pengeluaran</label>
            </div>

            <div class="baris-dua">
                <div class="field">
                    <label for="transaksi-tanggal">Tanggal</label>
                    <input type="date" id="transaksi-tanggal">
                    <small class="error" id="error-transaksi-tanggal"></small>
                </div>
                <div class="field">
                    <label for="transaksi-kategori">Kategori</label>
                    <select id="transaksi-kategori"></select>
                    <small class="error" id="error-transaksi-kategori"></small>
                </div>
            </div>

            <div class="field">
                <label for="transaksi-nominal">Nominal (Rp)</label>
                <input type="number" id="transaksi-nominal" min="1" inputmode="numeric" placeholder="contoh: 150000">
                <small class="error" id="error-transaksi-nominal"></small>
            </div>

            <div class="field">
                <label for="transaksi-catatan">Catatan <span class="opsional">(opsional)</span></label>
                <input type="text" id="transaksi-catatan" placeholder="contoh: Langganan Figma">
            </div>

            <div class="dialog-aksi">
                <button type="button" class="btn btn-garis" data-tutup>Batal</button>
                <button type="submit" class="btn btn-utama">Simpan</button>
            </div>
        </form>
    </dialog>

    <!-- Notifikasi kecil (toast) -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
